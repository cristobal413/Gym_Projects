{% extends 'Fuerza/base.html' %}

{% block title %}Iniciar Sesión - Gymm Project{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0">
                    <i class="bi bi-person-lock text-warning me-2"></i>Iniciar Sesión
                </h5>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger small" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i>Usuario o contraseña incorrectos. Inténtalo nuevamente.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Ingresa tu usuario">
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar al Sistema
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
